name: Supabase keepalive

# Supabase 免費專案連續一週沒有請求會被暫停，每天打一次 API 保持活躍
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call get_public_ledger with a dummy token
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets 未設定，略過"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/get_public_ledger" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}')
          echo "HTTP $status"
          test "$status" -lt 400
